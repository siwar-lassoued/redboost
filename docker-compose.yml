version: '3.9'
services:
  redis:
    image: redis:7-alpine
    container_name: redboost-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - 6380:6379
    volumes:
      - redis_data:/data
    networks:
      - redboost-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    container_name: redboost-backend
    image: ${REGISTRY}-backend:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/redboost?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Tunis
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_TIMEOUT: 2000ms
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION: 86400000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN}
      GOOGLE_OAUTH_ORGANIZER_EMAIL: ${GOOGLE_OAUTH_ORGANIZER_EMAIL}
      FIREBASE_CREDENTIALS_PATH: file:/app/firebase-service-account.json
      FILE_UPLOAD_DIR: /app/uploads
      # Disable health indicators that cause false DOWN status
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    ports:
      - 8083:8082
    volumes:
      - ./backend_uploads:/app/uploads
      - ./backend_tokens:/app/tokens
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./google-oauth-credentials.json:/app/google-oauth-credentials.json:ro
    networks:
      - redboost-net
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health; exit 0"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  ai-service:
    container_name: redboost-ai
    image: ${REGISTRY}-ai-service:latest
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - 8001:8000
    networks:
      - redboost-net

  frontend:
    container_name: redboost-frontend
    image: ${REGISTRY}-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - 8080:80
      - 8443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - redboost-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: redboost-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://frontend:8181/stub_status
    ports:
      - 9113:9113
    networks:
      - redboost-net
    depends_on:
      - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: redboost-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - 9090:9090
    networks:
      - redboost-net

  grafana:
    image: grafana/grafana:latest
    container_name: redboost-grafana
    restart: unless-stopped
    environment:
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${MAIL_USERNAME}
      - GF_SMTP_SKIP_VERIFY=true
      - GF_SMTP_FROM_ADDRESS=${MAIL_USERNAME}
      - GF_SMTP_FROM_NAME=Grafana
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - redboost-net
    depends_on:
      - prometheus

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  redboost-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16