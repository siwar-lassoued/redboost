<!-- kpi-filter-section.component.html -->
<div class="mb-8 bg-white rounded-2xl border border-gray-200 p-6">
    
    <!-- Header - always visible -->
    <div class="flex items-center justify-between" [class.mb-6]="!isCollapsed">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-pink-500 rounded-lg flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-900">Filtrage KPI</h2>
        </div>
        <div class="flex items-center gap-2">
            <button *ngIf="hasActiveFilters() && !isCollapsed" (click)="onResetFilters.emit()" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-600 hover:text-gray-900 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                Réinitialiser
            </button>
            <button (click)="isCollapsed = !isCollapsed" class="flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform duration-300" [class.rotate-180]="isCollapsed" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Collapsible content -->
    <div [class.hidden]="isCollapsed">

        <!-- Toggle Entrepreneur Tracking -->
        <div class="mb-6 flex items-center justify-between p-4 bg-cyan-50 rounded-xl border border-cyan-200">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-cyan-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <span class="text-sm font-medium text-gray-700">Afficher uniquement les KPI "Suivi Entrepreneur"</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" [checked]="showEntrepreneurTracking" (change)="onTrackingToggle($event)" class="sr-only peer" />
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-cyan-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-cyan-600"></div>
            </label>
        </div>

        <!-- Filters Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <!-- Programme Filter -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-cyan-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                    </svg>
                    Filtrer par Programme
                </label>
                <select [value]="selectedProgrammeFilter || ''" (change)="onProgrammeChange($event)" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-200">
                    <option value="">Tous les programmes</option>
                    <option *ngFor="let prog of programmes" [value]="prog.id">{{ prog.name }}</option>
                </select>
            </div>

            <!-- Region Filter -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-cyan-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Filtrer par Région
                </label>
                <select [value]="selectedRegionFilter || ''" (change)="onRegionChange($event)" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-200">
                    <option value="">Toutes les régions</option>
                    <option *ngFor="let region of regions" [value]="region">{{ region }}</option>
                </select>
            </div>

            <!-- Secteur Filter -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-cyan-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    Filtrer par Secteur
                </label>
                <select [value]="selectedSecteurFilter || ''" (change)="onSecteurChange($event)" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-200">
                    <option value="">Tous les secteurs</option>
                    <option *ngFor="let secteur of secteurs" [value]="secteur">{{ secteur }}</option>
                </select>
            </div>
        </div>

<!-- KPI List (flat, no category grouping) -->
<div class="border border-gray-200 rounded-xl overflow-hidden divide-y divide-gray-100">
    <ng-container *ngFor="let category of displayedCategories">
        <div *ngFor="let kpi of category.kpis"
             (click)="onKpiFilterChange.emit(kpi.id)"
             [class.bg-cyan-50]="selectedKpiFilter === kpi.id"
             class="flex items-center justify-between px-5 py-4 hover:bg-gray-50 transition-colors cursor-pointer group">

            <!-- Left: Icon + Name + Category -->
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-pink-500 flex items-center justify-center flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                </div>
                <div>
                    <p class="text-sm font-semibold text-gray-900 group-hover:text-cyan-700 transition-colors">{{ kpi.nom }}</p>
                    <p class="text-xs text-gray-400">{{ category.name }}</p>
                </div>
            </div>

            <!-- Right: Global/Optionnel badge + Entrepreneur name -->
            <div class="flex items-center gap-3 flex-shrink-0">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium border"
                      [ngClass]="getEntrepreneursTrackingKpi(kpi.id).length === 0
                          ? 'bg-white text-gray-600 border-gray-300'
                          : 'bg-white text-pink-600 border-pink-300'">
                    {{ getEntrepreneursTrackingKpi(kpi.id).length === 0 ? 'Global' : 'Optionnel' }}
                </span>

                <span *ngIf="getEntrepreneursTrackingKpi(kpi.id).length > 0"
                      class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-white border border-purple-200 text-purple-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    {{ getKpiEntrepreneurName(kpi.id) }}
                </span>

                <div *ngIf="selectedKpiFilter === kpi.id" class="text-cyan-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>
        </div>
    </ng-container>
</div>

    </div>
</div>
