# ============================================================
# Nginx configuration for redboost.tn
# Place this file at: /etc/nginx/sites-available/redboost.tn
# Then: sudo ln -sf /etc/nginx/sites-available/redboost.tn /etc/nginx/sites-enabled/
# Reload: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name redboost.tn www.redboost.tn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name redboost.tn www.redboost.tn;

    # ── SSL Certificates (adjust paths to your actual cert files) ────────
    ssl_certificate     /etc/letsencrypt/live/redboost.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redboost.tn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── WebSocket / SockJS proxy ──────────────────────────────────────────
    # IMPORTANT: This block MUST come BEFORE the /api block.
    # SockJS generates URLs like: /api/ws/{serverId}/{sessionId}/websocket
    # Nginx needs the Upgrade + Connection headers to allow the WS handshake.
    location /api/ws {
        proxy_pass         http://localhost:8082;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Keep WebSocket connections alive for up to 24 hours
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Also proxy /ws (Spring Boot registers both /ws and /api/ws) ───────
    location /ws {
        proxy_pass         http://localhost:8082;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Regular REST API ──────────────────────────────────────────────────
    location /api {
        proxy_pass         http://localhost:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Increase timeout for long-running requests (e.g. AI matching)
        proxy_read_timeout 120s;
    }

    # ── Uploaded files (served directly, not via Spring Boot) ────────────
    location /uploads {
        alias /path/to/redboost_backend/uploads;   # adjust to your actual uploads path
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Angular Frontend (SPA) ────────────────────────────────────────────
    location / {
        root /var/www/redboost;   # adjust to your Angular dist/ folder
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }
}
