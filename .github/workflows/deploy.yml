name: Build, Push & Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # ─── BUILD & PUSH BACKEND ──────────────────────────────────────────────
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./redboost_backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          labels: ${{ steps.meta.outputs.labels }}

      # ─── BUILD & PUSH FRONTEND ─────────────────────────────────────────────
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./redboost_frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_URL=https://redboost.tn

      # ─── BUILD & PUSH AI-SERVICE ───────────────────────────────────────────
      - name: Build and push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai-service:latest
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create working directory on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /home/redboost/docker/nginx/ssl /home/redboost/docker/prometheus /home/redboost/docker/backend_tokens /home/redboost/docker/backend_uploads"

      - name: Copy deployment files to VPS
        run: |
          # Copy files directly since docker-compose.yml now natively supports dynamic images via ${REGISTRY} env var
          scp -i ~/.ssh/id_ed25519 docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/
          scp -i ~/.ssh/id_ed25519 prometheus/prometheus.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/prometheus/
          scp -i ~/.ssh/id_ed25519 -r nginx/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/nginx/ || true
          
      - name: Deploy via Docker Compose
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Stop old systemd services (ignoring errors if they don't exist)
            sudo systemctl stop redboost-prod.service || true
            sudo systemctl stop redboost-ai.service || true
            sudo systemctl disable redboost-prod.service || true
            sudo systemctl disable redboost-ai.service || true
            
            cd /home/redboost/docker
            
            # Create a .env file for docker-compose to use the correct registry
            echo "REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" > .env
            
            # Login to GHCR to pull images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new images
            docker-compose pull
            
            # Restart containers without downtime
            docker-compose up -d --remove-orphans
            
            # Prune old images to save space
            docker image prune -af
          EOF