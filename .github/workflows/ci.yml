name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        working-directory: ./redboost_backend
        run: chmod +x mvnw

      - name: Run Backend Tests
        working-directory: ./redboost_backend
        # 'verify' runs both unit tests (surefire) and integration tests (failsafe)
        run: ./mvnw verify

  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./redboost_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./redboost_frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./redboost_frontend
        run: npm run test -- --watch=false --browsers=ChromeHeadless
