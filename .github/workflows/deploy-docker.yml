name: Build, Push & Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build images on GitHub's powerful runners and push to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./redboost_backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./redboost_frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          build-args: |
            API_URL=https://redboost.tn
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to VPS
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare directories on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /home/redboost/docker/nginx/ssl \
                      /home/redboost/docker/prometheus \
                      /home/redboost/docker/backend_tokens \
                      /home/redboost/docker/backend_uploads && \
             chmod -R 777 /home/redboost/docker/backend_uploads \
                          /home/redboost/docker/backend_tokens"

      - name: Copy deployment files to VPS
        run: |
          scp -i ~/.ssh/id_ed25519 docker-compose.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/
          scp -i ~/.ssh/id_ed25519 prometheus/prometheus.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/prometheus/
          scp -i ~/.ssh/id_ed25519 -r nginx/* \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/nginx/ || true

      - name: Stop old containers on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /home/redboost/docker || exit 1
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi
            echo "Stopping containers..."
            $COMPOSE down || true
            docker rm -f redboost-backend redboost-ai redboost-frontend 2>/dev/null || true
            rm -f /home/redboost/docker/firebase-service-account.json \
                  /home/redboost/docker/google-oauth-credentials.json || true
          EOF

      - name: Restore credentials on VPS
        run: |
          if ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "[ -f /home/redboost/config-prod/firebase-service-account.json ]"; then
            ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cp /home/redboost/config-prod/firebase-service-account.json \
                  /home/redboost/docker/firebase-service-account.json"
          else
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' | \
              ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cat > /home/redboost/docker/firebase-service-account.json"
          fi

          if ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "[ -f /home/redboost/config-prod/google-oauth-credentials.json ]"; then
            ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cp /home/redboost/config-prod/google-oauth-credentials.json \
                  /home/redboost/docker/google-oauth-credentials.json"
          else
            printf '%s' '${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}' | \
              ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cat > /home/redboost/docker/google-oauth-credentials.json"
          fi

          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod 644 /home/redboost/docker/firebase-service-account.json \
                       /home/redboost/docker/google-oauth-credentials.json"

      - name: Protect .env on VPS (never overwrite)
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "if [ ! -f /home/redboost/docker/.env ]; then
              echo '.env missing on VPS! Deployment aborted.'
              exit 1
            fi
            echo '.env exists on VPS, skipping overwrite.'
            cat /home/redboost/docker/.env | grep -v 'PASSWORD\|SECRET\|KEY\|TOKEN' || true"

      - name: Deploy — pull & start
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' GHCR_USER='${{ github.actor }}' bash -s" << 'EOF'
            set -e
            cd /home/redboost/docker

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            echo "Step 1: Prune unused images..."
            docker image prune -af || true

            echo "Step 2: Login to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "Step 3: Pull new images..."
            $COMPOSE pull

            echo "Step 4: Copier StoredCredential si absent..."
            if [ -f /home/redboost/tokens/StoredCredential ] && \
               [ ! -f /home/redboost/docker/backend_tokens/StoredCredential ]; then
              cp /home/redboost/tokens/StoredCredential \
                 /home/redboost/docker/backend_tokens/StoredCredential
              echo "StoredCredential copié."
            fi

            echo "Step 5: Start all services..."
            $COMPOSE up -d --remove-orphans --no-build

            echo "Step 6: Wait for backend health (max 5 min)..."
            for i in $(seq 1 30); do
              # Check if container is running first
              RUNNING=$(docker inspect -f '{{.State.Running}}' redboost-backend 2>/dev/null || echo "false")
              if [ "$RUNNING" != "true" ]; then
                echo "  [$i/30] backend: not running yet..."
                sleep 10
                continue
              fi

              # Check health via actuator directly
              HTTP_CODE=$(docker exec redboost-backend sh -c \
                "wget -qO- http://localhost:8082/actuator/health 2>&1" \
                | grep -c '"status":"UP"' || true)

              echo "  [$i/30] backend: $([ "$HTTP_CODE" -gt 0 ] && echo 'UP' || echo 'starting...')"

              if [ "$HTTP_CODE" -gt 0 ]; then
                echo "Backend is healthy!"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "Backend did not become healthy in time. Logs:"
                $COMPOSE logs --tail=100 backend
                exit 1
              fi
              sleep 10
            done

            echo "Deployment complete!"
            $COMPOSE ps
          EOF