name: Build, Push & Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build images on GitHub's powerful runners and push to GHCR
  # The VPS (2 GB RAM) never has to build — it just pulls the ready image.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── BACKEND ──────────────────────────────────────────────────────────────
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./redboost_backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── FRONTEND ─────────────────────────────────────────────────────────────
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./redboost_frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          build-args: |
            API_URL=https://redboost.tn
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── AI SERVICE ───────────────────────────────────────────────────────────
      - name: Build and push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to VPS using Option A (stop → pull → start)
  # Stops old containers first to free all 2 GB RAM, then starts fresh.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare directories on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /home/redboost/docker/nginx/ssl \
                      /home/redboost/docker/prometheus \
                      /home/redboost/docker/backend_tokens \
                      /home/redboost/docker/backend_uploads"

      - name: Copy deployment files to VPS
        run: |
          scp -i ~/.ssh/id_ed25519 docker-compose.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/
          scp -i ~/.ssh/id_ed25519 prometheus/prometheus.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/prometheus/
          scp -i ~/.ssh/id_ed25519 -r nginx/* \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/nginx/ || true

      # Write the firebase credentials from GitHub Secret onto the VPS
      # (only runs if the secret is set)
      - name: Validate Firebase credentials secret
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON GitHub secret is missing or empty."
            exit 1
          fi

      - name: Upload Firebase credentials to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo rm -rf /home/redboost/docker/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | \
            ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo tee /home/redboost/docker/firebase-service-account.json >/dev/null && sudo chmod 644 /home/redboost/docker/firebase-service-account.json"
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "test -s /home/redboost/docker/firebase-service-account.json"

      # Write the .env file — done via ssh echo to avoid secrets in scp
      - name: Write .env on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash << ENVSSH
            cat > /home/redboost/docker/.env << 'ENVEOF'
          REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN=${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_OAUTH_ORGANIZER_EMAIL=${{ secrets.GOOGLE_OAUTH_ORGANIZER_EMAIL }}
          ENVEOF
          ENVSSH

      # ── OPTION A: Stop → Pull → Start (RAM-safe for 2 GB VPS) ───────────────
      - name: Deploy (stop old, start new)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' GHCR_USER='${{ github.actor }}' FULL_REGISTRY='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' bash -s" << 'EOF'
            set -e
            cd /home/redboost/docker

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Docker Compose is not installed on the VPS."
              echo "Install Docker Compose v2, or install the legacy docker-compose command."
              exit 1
            fi

            echo " Step 1: Stop all running containers to free RAM..."
            $COMPOSE down || true
            docker rm -f redboost-backend redboost-ai redboost-frontend 2>/dev/null || true
            echo " Containers currently using frontend ports:"
            docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}' | grep -E '(:|0.0.0.0:)8080->|:::8080->|(:|0.0.0.0:)8443->|:::8443->' || true
            STALE_CONTAINERS=$(docker ps -a --format '{{.ID}} {{.Ports}}' | awk '$0 ~ /(:|0\.0\.0\.0:)8080->|:::8080->|(:|0\.0\.0\.0:)8443->|:::8443->/ {print $1}')
            if [ -n "$STALE_CONTAINERS" ]; then
              echo " Removing stale container(s) using frontend ports: $STALE_CONTAINERS"
              docker rm -f $STALE_CONTAINERS
            fi

            echo " Step 2: Remove unused images to free disk..."
            docker image prune -af || true

            echo " Step 3: Login to GHCR to pull images..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo " Step 4: Pull new images (no local build needed)..."
            $COMPOSE pull

            echo " Step 5: Start all services..."
            if ! $COMPOSE up -d --remove-orphans --no-build; then
              echo " Compose startup failed. Current status:"
              $COMPOSE ps || true
              echo " Redis logs:"
              $COMPOSE logs --tail=100 redis || true
              echo " Backend logs:"
              $COMPOSE logs --tail=200 backend || true
              echo " Frontend logs:"
              $COMPOSE logs --tail=200 frontend || true
              exit 1
            fi

            echo " Step 6: Wait for backend health..."
            for i in $(seq 1 30); do
              BACKEND_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' redboost-backend 2>/dev/null || echo "missing")
              echo " Backend health: $BACKEND_HEALTH"
              if [ "$BACKEND_HEALTH" = "healthy" ]; then
                break
              fi
              if [ "$BACKEND_HEALTH" = "unhealthy" ]; then
                echo " Backend became unhealthy. Logs:"
                $COMPOSE logs --tail=200 backend || true
                exit 1
              fi
              sleep 10
            done

            BACKEND_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' redboost-backend 2>/dev/null || echo "missing")
            if [ "$BACKEND_HEALTH" != "healthy" ]; then
              echo " Backend did not become healthy in time. Logs:"
              $COMPOSE logs --tail=200 backend || true
              exit 1
            fi

            echo " Deployment complete! Container status:"
            $COMPOSE ps
          EOF
