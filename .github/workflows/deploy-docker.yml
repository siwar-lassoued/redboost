name: Build, Push & Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build images on GitHub's powerful runners and push to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./redboost_backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./redboost_frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          build-args: |
            API_URL=https://redboost.tn
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to VPS
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare directories on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /home/redboost/docker/nginx/ssl \
                      /home/redboost/docker/prometheus \
                      /home/redboost/docker/backend_tokens \
                      /home/redboost/docker/backend_uploads"

      - name: Copy deployment files to VPS
        run: |
          scp -i ~/.ssh/id_ed25519 docker-compose.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/
          scp -i ~/.ssh/id_ed25519 prometheus/prometheus.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/prometheus/
          scp -i ~/.ssh/id_ed25519 -r nginx/* \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/redboost/docker/nginx/ || true

      - name: Stop old containers on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /home/redboost/docker || exit 1
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi
            echo "Stopping containers..."
            $COMPOSE down || true
            docker rm -f redboost-backend redboost-ai redboost-frontend 2>/dev/null || true
            # Supprimer les fichiers credential pour éviter les conflits de type dir/file
            rm -f /home/redboost/docker/firebase-service-account.json \
                  /home/redboost/docker/google-oauth-credentials.json || true
          EOF

      - name: Restore credentials on VPS
        run: |
          # Firebase — depuis config-prod sur le VPS (priorité) ou depuis secret GitHub
          if ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "[ -f /home/redboost/config-prod/firebase-service-account.json ]"; then
            ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cp /home/redboost/config-prod/firebase-service-account.json \
                  /home/redboost/docker/firebase-service-account.json"
          else
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' | \
              ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cat > /home/redboost/docker/firebase-service-account.json"
          fi

          # Google OAuth Drive credentials
          if ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "[ -f /home/redboost/config-prod/google-oauth-credentials.json ]"; then
            ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cp /home/redboost/config-prod/google-oauth-credentials.json \
                  /home/redboost/docker/google-oauth-credentials.json"
          else
            printf '%s' '${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}' | \
              ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cat > /home/redboost/docker/google-oauth-credentials.json"
          fi

          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod 644 /home/redboost/docker/firebase-service-account.json \
                       /home/redboost/docker/google-oauth-credentials.json"

      # ── CORRECTION CLÉ : heredoc sans indentation pour éviter les valeurs vides ──
      - name: Write .env on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cat > /home/redboost/docker/.env" << EOF
            REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
            GOOGLE_OAUTH_REFRESH_TOKEN=${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
            GOOGLE_OAUTH_ORGANIZER_EMAIL=${{ secrets.GOOGLE_OAUTH_ORGANIZER_EMAIL }}
            EOF

      - name: Deploy — pull & start
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' GHCR_USER='${{ github.actor }}' bash -s" << 'EOF'
            set -e
            cd /home/redboost/docker

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            echo "Step 1: Prune unused images..."
            docker image prune -af || true

            echo "Step 2: Login to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "Step 3: Pull new images..."
            $COMPOSE pull

            echo "Step 4: Copier StoredCredential si absent..."
            if [ -f /home/redboost/tokens/StoredCredential ] && \
               [ ! -f /home/redboost/docker/backend_tokens/StoredCredential ]; then
              cp /home/redboost/tokens/StoredCredential \
                 /home/redboost/docker/backend_tokens/StoredCredential
              echo "StoredCredential copié."
            fi

            echo "Step 5: Start all services..."
            $COMPOSE up -d --remove-orphans --no-build

            echo "Step 6: Wait for backend health (max 5 min)..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' redboost-backend 2>/dev/null || echo "missing")
              echo "  [$i/30] backend: $STATUS"
              [ "$STATUS" = "healthy" ] && break
              if [ "$STATUS" = "unhealthy" ]; then
                echo "Backend unhealthy. Logs:"
                $COMPOSE logs --tail=100 backend
                exit 1
              fi
              sleep 10
            done

            FINAL=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' redboost-backend 2>/dev/null || echo "missing")
            if [ "$FINAL" != "healthy" ]; then
              echo "Backend did not become healthy. Logs:"
              $COMPOSE logs --tail=100 backend
              exit 1
            fi

            echo "Deployment complete!"
            $COMPOSE ps
          EOF