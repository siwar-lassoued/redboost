version: '3.9'
services:
  redis:
    image: redis:7-alpine
    container_name: redboost-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    networks:
      - redboost-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    container_name: redboost-backend
    build:
      context: ./redboost_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/redboost?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN}
      GOOGLE_OAUTH_ORGANIZER_EMAIL: ${GOOGLE_OAUTH_ORGANIZER_EMAIL}
      FIREBASE_CREDENTIALS_PATH: "file:/app/firebase-service-account.json"
      FILE_UPLOAD_DIR: /app/uploads
    ports:
      - "8082:8082"
    volumes:
      - ./backend_uploads:/app/uploads
      - ./backend_tokens:/app/tokens
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./google-oauth-credentials.json:/app/google-oauth-credentials.json:ro
    networks:
      - redboost-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-service:
    container_name: redboost-ai
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    networks:
      - redboost-net

  frontend:
    container_name: redboost-frontend
    build:
      context: ./redboost_frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://localhost:8082
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - redboost-net

networks:
  redboost-net:
    driver: bridge