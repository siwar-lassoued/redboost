# ═══════════════════════════════════════════
# Spring Boot — Profil Docker
# Activé via: -Dspring.profiles.active=docker
# ═══════════════════════════════════════════

spring.application.name=redboost

# ─── Server ───────────────────────────────
server.port=8082

# ─── Database (injecté depuis docker-compose) ─
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ─── JWT ─────────────────────────────────
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── AI Service ──────────────────────────
ai.service.base-url=${AI_SERVICE_BASE_URL:http://ai-service:8000}
# groq.api.key is set in ai_service/.env (GROQ_API_KEY)

# ─── Firebase ────────────────────────────
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:file:/app/firebase-service-account.json}


# ─── Email ───────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Google OAuth ────────────────────────
# Default to empty string so startup doesn't fail when not configured
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
google.oauth.refresh-token=${GOOGLE_OAUTH_REFRESH_TOKEN:}
google.oauth.organizer-email=${GOOGLE_OAUTH_ORGANIZER_EMAIL:}

# ─── Google Drive ────────────────────────
google.drive.credentials.path=${GOOGLE_DRIVE_CREDENTIALS_PATH:/app/google-oauth-credentials.json}
google.drive.tokens.directory=/app/tokens
google.drive.folder.id=${GOOGLE_DRIVE_FOLDER_ID:}

# ─── File Storage ────────────────────────
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}
file.upload.sprint-documents-dir=/app/uploads/sprint-documents
file.upload.activity-documents-dir=/app/uploads/activity-documents
file.upload.tache-documents-dir=/app/uploads/tache-documents

# Multipart Config
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# ─── Redis ───────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2000ms}
spring.data.redis.connect-timeout=1000ms

# ─── Actuator (health check Docker) ─────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.main.allow-bean-definition-overriding=true

# ─── Logging ─────────────────────────────
logging.level.root=WARN
logging.level.team.project.redboost=INFO
logging.level.org.springframework.web=WARN

# Monitoring (Actuator & Prometheus)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=redboost-backend
